
# Cloud Run terminates HTTPS before Nginx. Retain its protocol header, while
# ordinary local HTTP requests fall back to the connection's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    # Never enable header-level debug logs on the identity-bearing proxy.
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # No URI suffix: preserve /api/ and the original query string.
    location /api/ {
        include /etc/nginx/backend-auth.conf;
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Backend-ID-Token "";
        proxy_hide_header X-Backend-ID-Token;
        proxy_hide_header X-Serverless-Authorization;
        proxy_hide_header Authorization;

        proxy_ssl_server_name on;
        proxy_ssl_name ${BACKEND_HOST};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
    }

    location = /_backend_identity {
        internal;
        proxy_pass http://127.0.0.1:8081/token;
        proxy_method GET;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host localhost;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location @identity_unavailable {
        default_type application/json;
        return 503 '{"error":"Backend authentication unavailable."}';
    }

    # Version evidence must not be served from an older browser/proxy cache.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Support React frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
