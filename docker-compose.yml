
services:
  # PostgreSQL database
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow_local_password
      POSTGRES_DB: workflow
    ports:
      - "5433:5432"
    volumes:
      - workflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Run database migrations before starting the backend
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: builder
    command: ["npm", "run", "migrate", "--", "--config", "prisma7.config.ts"]
    environment:
      DATABASE_URL: postgresql://workflow:workflow_local_password@db:5432/workflow?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Express backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    environment:
      DATABASE_URL: postgresql://workflow:workflow_local_password@db:5432/workflow?schema=public
      JWT_SECRET: local-docker-development-secret-change-before-production-2026
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DESIGNATED_REVIEWER_EMAIL: reviewer@example.test
    ports:
       - "4000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # React frontend served by Nginx
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

# Persistent database storage
volumes:
  workflow-db-data: