name: GCP Authentication Check

on:
  workflow_dispatch:

permissions: {}

jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write

    steps:
      - name: Authenticate through WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_AUTH_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Confirm authentication without displaying credentials
        env:
          TOKEN_PRESENT: ${{ steps.auth.outputs.access_token != '' }}
        run: |
          test "$TOKEN_PRESENT" = "true"
          echo "PASS: GitHub OIDC exchange and service-account impersonation."
